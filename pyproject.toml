[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kirby2"
version = "0.1.0"
description = "Deterministic market-execution training sandbox"
requires-python = ">=3.11"

[project.scripts]
kirby2 = "kirby2.__main__:main"

[tool.setuptools.package-data]
"kirby2.scenarios" = ["accepted_scenarios.json"]
"kirby2.historical" = ["fixtures/*.json"]
"kirby2.simulation" = ["accepted_hawkes.json"]
