[[functional_steps]]
step_id = "CLEAN_INSTALL"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "INSTALL_SELECTED_ARTIFACTS_OFFLINE"
expected = "EXACT_ARTIFACT_SET_INSTALLED"

[[functional_steps]]
step_id = "LAUNCH"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "LAUNCH_INSTALLED_ARTIFACT"
expected = "LOCAL_APPLICATION_READY"

[[functional_steps]]
step_id = "FULL_FIRST_RUN"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "RUN_COMPLETE_FIRST_RUN_FLOW"
expected = "PATHS_HEALTH_STARTER_SET_AND_DEMO_PASS"

[[functional_steps]]
step_id = "STARTER_LESSON"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "OPEN_FIRST_STARTER_LESSON"
expected = "EXACT_BUNDLED_LESSON_READY"

[[functional_steps]]
step_id = "PLACE_CANCEL"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "PLACE_AND_CANCEL_ONE_SIMULATED_ORDER"
expected = "NO_FILL_AND_CONSERVATION_PASS"

[[functional_steps]]
step_id = "COMPLETE_SAVE"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "COMPLETE_AND_SAVE_STARTER_SESSION"
expected = "IMMUTABLE_RUN_MANIFEST_COMMITTED"

[[functional_steps]]
step_id = "OPEN_REPLAY_MICROSCOPE"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "OPEN_SAVED_SESSION_AS_OBSERVED"
expected = "ALL_SUPPORTED_PANES_RENDER_OFFLINE"

[[functional_steps]]
step_id = "EXPORT_PACK"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "EXPORT_SAVED_SESSION_PACK"
expected = "PACK_VERIFIES_WITH_OWNING_ADAPTER"

[[functional_steps]]
step_id = "CLOSE"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "CLOSE_APPLICATION_CLEANLY"
expected = "NO_ACTIVE_MUTATION_REMAINS"

[[functional_steps]]
step_id = "REOPEN_VERIFY_SAVED"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "REOPEN_AND_VERIFY_SAVED_SESSION"
expected = "DECLARED_REPLAY_DIGEST_UNCHANGED"

[[functional_steps]]
step_id = "IMPORT_SECOND_CLEAN_ROOT"
root_role = "SECONDARY_CLEAN_ROOT"
mutation = "IMPORT_EXPORTED_PACK_OFFLINE"
expected = "EXACT_PACK_ACTIVE_WITH_DEPENDENCIES"

[[functional_steps]]
step_id = "REPLAY_IMPORTED_LESSON"
root_role = "SECONDARY_CLEAN_ROOT"
mutation = "REPLAY_IMPORTED_LESSON"
expected = "REPLAY_VERIFICATION_PASS"

[[functional_steps]]
step_id = "COMPARE_DECLARED_REPLAY_DIGEST"
root_role = "BOTH_CLEAN_ROOTS"
mutation = "COMPARE_DECLARED_REPLAY_DIGESTS"
expected = "BYTE_EXACT_DIGEST_EQUALITY"

[[functional_steps]]
step_id = "RESTORE_BACKUP"
root_role = "RESTORE_CLEAN_ROOT"
mutation = "RESTORE_VERIFIED_BACKUP"
