[cross_platform]
workload_id = "CROSS_PLATFORM_INTEGER_CORE_V1"
root_start = 4000000
root_end_inclusive = 4000015

[closeout]
prerequisite_id = "WO40_J_PREREQUISITES_V1"
required_gates = [
  "K2X-02",
  "WO31-A", "WO31-B", "WO31-C", "WO31-D", "WO31-E1", "WO31-E2", "WO31-E3", "WO31-E4", "WO31-E5", "WO31-E6", "WO31-F", "WO31-G", "WO31-H", "WO31-I", "WO31-I1",
  "WO32-A", "WO32-B", "WO32-C", "WO32-D", "WO32-E",
  "WO33-A", "WO33-A1", "WO33-B1", "WO33-B2", "WO33-C", "WO33-D", "WO33-E",
  "WO34-A", "WO34-B", "WO34-C", "WO34-D",
  "WO35-A", "WO35-B", "WO35-C", "WO35-D", "WO35-E", "WO35-F", "WO35-F1",
  "WO36-A", "WO36-B", "WO36-C", "WO36-D", "WO36-E",
  "WO37-A", "WO37-B", "WO37-C", "WO37-D", "WO37-E",
  "WO39-A", "WO39-B", "WO39-C",
  "WO38-A", "WO38-B", "WO38-C", "WO38-D", "WO38-E",
  "WO39-D1", "WO39-D2", "WO39-E",
  "WO40-A", "WO40-B", "WO40-B1", "WO40-C", "WO40-D", "WO40-D1", "WO40-E", "WO40-F", "WO40-G", "WO40-H", "WO40-I",
