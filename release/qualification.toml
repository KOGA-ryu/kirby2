[[functional_steps]]
step_id = "UNINSTALL_PRESERVE_USER_DATA"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "REMOVE_APPLICATION_ARTIFACTS_ONLY"
expected = "GOVERNED_USER_DATA_REMAINS_BYTE_IDENTICAL"

[[headless_extra_steps]]
step_id = "HEADLESS_SIMULATION"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "RUN_INSTALLED_HEADLESS_SIMULATION"
expected = "SIMULATION_AND_REPLAY_PASS"

[[headless_extra_steps]]
step_id = "HEADLESS_AUDIT"
root_role = "PRIMARY_CLEAN_ROOT"
mutation = "RUN_INSTALLED_HEADLESS_AUDIT"
