schema_version = 1
release_version = "0.1.0"
protocol_id = "RELEASE_QUALIFICATION_V1"
offline_required = true
user_data_preservation_required = true
evidence_gate_order = ["WO40-D1", "WO40-E", "WO40-F", "WO40-G", "WO40-H", "WO40-I", "WO40-J"]

[retry_policy]
attempts_per_clean_root = 1
result_retry_count = 0
